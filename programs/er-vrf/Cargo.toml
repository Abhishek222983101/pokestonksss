[package]
name = "er-vrf"
version = "0.1.0"
description = "Spike: ER + delegated VRF + session keys + crank on MagicBlock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "er_vrf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
# crank (ScheduleTask CPI built by hand, exactly as in docs/tools/crank/implementation)
magicblock-magic-program-api = { version = "0.10.1", default-features = false }
bincode = "1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
